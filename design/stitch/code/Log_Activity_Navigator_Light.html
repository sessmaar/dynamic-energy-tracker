<!-- Inline JS for micro-interactions -->
<script>
        // Activity Card Toggle
        function toggleActivity(element) {
            document.querySelectorAll('.activity-card').forEach(card => {
                card.classList.remove('active', 'border-primary', 'bg-primary-fixed');
                card.classList.add('bg-surface-container-lowest', 'border-outline-variant');
                // Reset icon fill
                let icon = card.querySelector('.material-symbols-outlined');
                icon.style.fontVariationSettings = "'FILL' 0";
                icon.parentElement.classList.remove('text-primary');
                icon.parentElement.classList.add('text-on-surface');
            });
            
            element.classList.add('active');
            element.classList.remove('bg-surface-container-lowest', 'border-outline-variant');
            
            let icon = element.querySelector('.material-symbols-outlined');
            icon.style.fontVariationSettings = "'FILL' 1";
            icon.parentElement.classList.remove('text-on-surface');
            icon.parentElement.classList.add('text-primary');
            
            animateValue();
        }

        // Intensity Segment Toggle
        function setSegment(element) {
            document.querySelectorAll('.segment-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-on-surface', 'text-on-primary', 'shadow-sm');
                btn.classList.add('text-on-surface-variant');
            });
            element.classList.add('active', 'bg-on-surface', 'text-on-primary', 'shadow-sm');
            element.classList.remove('text-on-surface-variant');
            animateValue();
        }

        // Adjust Duration
        function adjustValue(id, amount) {
            const input = document.getElementById(id);
            let val = parseInt(input.value) + amount;
            if(val < 5) val = 5;
            input.value = val;
            animateValue();
        }

        // Simulate Energy Flux calculation recalculation
        function animateValue() {
            const display = document.querySelector('.font-data-mono.text-\\[42px\\]');
            const current = parseInt(display.innerText);
            const target = current + Math.floor(Math.random() * 50) - 15; // Random fluctuation for demo
            
            display.style.opacity = '0.5';
            setTimeout(() => {
                display.innerText = target > 50 ? target : 120; // Keep reasonable
                display.style.opacity = '1';
                display.style.transform = 'scale(1.05)';
                setTimeout(() => display.style.transform = 'scale(1)', 150);
            }, 150);
        }
    </script>
